# Daily snapshot of the hits.sh counters (see README "Privacy") into stats.csv on the
# `stats` branch, so usage history survives if hits.sh resets or goes away.
# The /api/urns endpoint is read-only: it does not add a hit.
name: Usage stats

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # keepalive below

concurrency:
  group: usage-stats

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the stats branch (created on first run)
        run: |
          git init -q stats && cd stats
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin stats; then git checkout -q -b stats FETCH_HEAD; else git checkout -q --orphan stats; fi
      - name: Append today's totals
        working-directory: stats
        run: |
          # 404 = counter not hit yet (0); any other failure fails the run.
          total() {
            code=$(curl -sS -o body.json -w '%{http_code}' "https://hits.sh/api/urns/tupe12334.github.io/$1")
            if [ "$code" = 404 ]; then echo '{"items":[]}' > body.json; echo 0; else [ "$code" = 200 ] && jq -e '.total' body.json; fi
          }
          visits=$(total ringon)
          users=$(total ringon-users)
          # Daily active users for yesterday's hits.sh day (Korea time, UTC+9); at 00:30 UTC it is complete.
          total ringon-daily-users > /dev/null
          yesterday=$(TZ=Asia/Seoul date -d yesterday +%F)
          daily=$(jq --arg d "$yesterday" '[.items[].data[] | select(.day == $d) | .value] | add // 0' body.json)
          [ -f stats.csv ] || echo "date,visits_total,users_total,daily_users_yesterday" > stats.csv
          # Older files lack the daily column: add it, leaving old rows blank.
          head -1 stats.csv | grep -q daily_users || sed -i '1s/$/,daily_users_yesterday/; 2,$s/$/,/' stats.csv
          echo "$(date -u +%F),$visits,$users,$daily" >> stats.csv
          echo "Users: $users · Visits: $visits · Daily users ($yesterday): $daily" >> "$GITHUB_STEP_SUMMARY"
      - name: Push
        working-directory: stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.csv
          git commit -qm "Usage stats $(date -u +%F)"
          git push -q origin stats
      - name: Keep the usage crons enabled
        # GitHub disables scheduled workflows in public repos after 60 days without
        # repository activity; re-enabling from a running job resets that clock.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow enable usage-stats.yml
          gh workflow enable usage-report.yml
