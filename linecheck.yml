# yaml-language-server: $schema=https://raw.githubusercontent.com/tupe12334/linecheck/main/schema/linecheck.schema.json

rules:
  # Grandfathered: already over the 400-line error threshold. Capped at their
  # current size so they can't grow further; lower these as they get split.
  - pattern: "src/ring/geometry.ts"
    warn: 400
    error: 600
    error_message: "Grandfathered file grew — split by responsibility instead of adding more"
  - pattern: "src/customizer/panels.tsx"
    warn: 400
    error: 460
    error_message: "Grandfathered file grew — split by responsibility instead of adding more"
  # Translation tables: flat strings, one language per file, so the whole language is reviewed in one place.
  - pattern: "src/i18n/en.ts"
    warn: 550
    error: 600
    error_message: "Move a section of the UI text to its own key group file"
  - pattern: "src/i18n/locales/*.ts"
    warn: 550
    error: 600
    error_message: "Keep the same shape as en.ts; if en.ts was split, split this file the same way"
  - pattern: "**/*.ts"
    warn: 200
    warn_message: "Getting long — consider splitting into smaller modules"
    error: 400
    error_message: "Too large to review easily; split this file now"
  - pattern: "**/*.tsx"
    warn: 200
    warn_message: "Getting long — consider splitting into smaller components"
    error: 400
    error_message: "Too large to review easily; split this file now"

exclude:
  - "node_modules/**"
  - "dist/**"
  - "pnpm-lock.yaml"
  - "test-results/**"
  - "playwright-report/**"
