<!doctype html>
<!-- Ringon moved to ringon.app. GitHub Pages serves this page (and 404.html) for every old /ringon/ URL. -->
<meta charset="utf-8">
<title>Ringon moved to ringon.app</title>
<meta http-equiv="refresh" content="0; url=https://ringon.app/">
<link rel="canonical" href="https://ringon.app/">
<script>
  var path = location.pathname.replace(/^\/ringon(?=\/|$)/, '') || '/'
  location.replace('https://ringon.app' + path + location.search + location.hash)
</script>
<p>Ringon moved to <a href="https://ringon.app/">ringon.app</a>.</p>
